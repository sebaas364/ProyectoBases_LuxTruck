<div class="page">

  <div class="login-container">

    <img src="logo.png" class="logo" alt="LuxTruck">

    <h2>Bienvenido</h2>
    <span>Inicia sesión para continuar</span>

    <input
      type="email"
      placeholder="Correo electrónico"
      [(ngModel)]="correo"
      (keydown)="onKeyDown($event)"
      [disabled]="cargando"
      autocomplete="email"
    >

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
      (keydown)="onKeyDown($event)"
      [disabled]="cargando"
      autocomplete="current-password"
    >

    <button (click)="login()" [disabled]="cargando" [class.cargando]="cargando">
      <span *ngIf="!cargando">Ingresar</span>
      <span *ngIf="cargando">Verificando...</span>
    </button>

    <p *ngIf="mensaje" [ngClass]="tipoMensaje">{{ mensaje }}</p>

  </div>

</div>
