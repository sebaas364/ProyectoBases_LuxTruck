<div class="page">

   

    <div class="login-container">
       <img src="logo.png" class="logo">
        <h2>Bienvenido</h2>
        <span>Inicia sesión para continuar</span>

        <input
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="correo"
        >

        <input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
        >



        <button (click)="login()">
            Ingresar
        </button>

        <p>{{ mensaje }}</p>

    </div>

</div>
